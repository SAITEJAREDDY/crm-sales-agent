<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Meme: the CRM says 90 percent likely to close, reality says the champion left in March">
  <rect width="800" height="440" rx="18" fill="#14181f"/>
  <text x="400" y="58" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="38" fill="#ffffff" letter-spacing="1">THE CRM VS. REALITY</text>

  <rect x="30" y="85" width="350" height="280" rx="12" fill="#1f7a4d"/>
  <text x="205" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#d9ffe9">THE CRM SAYS</text>
  <text x="205" y="238" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="110" fill="#ffffff">90%</text>
  <text x="205" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ffffff">likely to close</text>
  <circle cx="205" cy="324" r="22" fill="#ffffff"/>
  <path d="M194 324 l8 9 l16 -18" fill="none" stroke="#1f7a4d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="420" y="85" width="350" height="280" rx="12" fill="#8a2b2b"/>
  <text x="595" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#ffe0e0">REALITY</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#ffffff">
    <text x="440" y="175">The champion left in March.</text>
    <text x="440" y="215">The budget got moved.</text>
    <text x="440" y="255">Legal has not opened the</text>
    <text x="440" y="285">contract.</text>
  </g>
  <text x="440" y="335" font-family="Arial, sans-serif" font-style="italic" font-size="20" fill="#ffd2d2">Close date: still this quarter.</text>

  <text x="400" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9aa4b2">Every forecast call, ever.</text>
</svg>
